name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Comprobación de sintaxis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

  shellcheck:
    name: Validación de scripts de shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            install.sh \
            install-desktop.sh \
            airgeddon-gui.sh \
            build-deb.sh

  package-deb:
    name: Paquete Debian y arranque limpio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Construir paquete nativo
        run: ./build-deb.sh
      - name: Comprobar arquitectura y arranque del paquete extraído
        run: |
          artifact="$(find . -maxdepth 1 -name 'airgeddon-gui_*.deb' -print -quit)"
          test "$(dpkg-deb -f "$artifact" Architecture)" = "$(dpkg --print-architecture)"
          dpkg-deb -x "$artifact" "$RUNNER_TEMP/airgeddon-package"
          node scripts/verify-package.js "$RUNNER_TEMP/airgeddon-package/opt/airgeddon-gui"
