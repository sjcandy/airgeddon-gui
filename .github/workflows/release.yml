name: "Releases"
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            airgeddon-gui_*.deb
